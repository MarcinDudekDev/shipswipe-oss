[project]
name = "shipswipe-server"
version = "0.1.0"
description = "ShipSwipe backend — Stario + Datastar hypermedia"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "itsdangerous>=2.2.0",
    "msgspec>=0.21.1",
    "redis>=8.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "stario>=3.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-json-report>=1.5.0",
]

[tool.uv]
# brotli comes in via stario; 1.2.0 is vulnerable (CVE-2026-111497).
# anyio < 4.14.2 is vulnerable (PYSEC-2026-4023/4024/4025).
constraint-dependencies = ["brotli>=1.2.1", "anyio>=4.14.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
